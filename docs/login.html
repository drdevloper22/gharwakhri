<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | Gharwakhari</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <section class="auth-section">
        <div class="auth-box">
            <h1 class="brand-logo">Gharwakhari</h1>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Luxury Living Starts Here</p>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required>
                    <label for="username">Username / Email</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder=" " required>
                    <label for="password">Password</label>
                </div>

                <div class="auth-options">
                    <label class="remember">
                        <input type="checkbox" checked> Remember Me
                    </label>
                    <a href="#" class="forgot" onclick="alert('Password reset link sent to your registered email.')">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <p class="switch-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>
            <p class="switch-text" style="margin-top: 15px;">
                <a href="index.html" style="color: #666; font-weight: normal;"><i class="fas fa-arrow-left"></i> Return to Store</a>
            </p>
        </div>
    </section>

    <script>
        function handleLoginSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            if (username) {
                localStorage.setItem('ghar_user', username);
                alert(`Welcome back, ${username}!`);
                window.location.href = "account.html";
            }
        }
    </script>
</body>

</html>
