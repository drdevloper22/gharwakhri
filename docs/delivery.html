<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharwakhari | Delivery Details</title>
    <meta name="description" content="Enter your delivery details to complete your order at Gharwakhari.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .delivery-section {
            padding: 60px 20px;
            min-height: 70vh;
            background-color: #fcfbf8;
        }

        .delivery-container {
            max-width: 650px;
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .delivery-header {
            text-align: center;
            font-family: 'Playfair Display', serif;
            margin-bottom: 25px;
            font-size: 2.2rem;
            color: var(--color-brown, #2c2926);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--color-maroon, #701C1C);
            outline: none;
        }

        .btn-submit {
            background-color: var(--color-maroon, #701C1C);
            color: #fff;
            padding: 15px 30px;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            font-size: 1.05rem;
            width: 100%;
            transition: 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--color-gold, #C5A059);
            color: #000;
        }

        .order-summary {
            background: #f9f7f4;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #eae5df;
        }

        .order-summary h4 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            color: var(--color-maroon, #701C1C);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #555;
            font-size: 0.95rem;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            font-weight: bold;
            font-size: 1.2rem;
            color: #000;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">Gharwakhari</a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label"><span></span></label>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#shop">Shop</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="about.html">About</a></li>
                    <li id="auth-nav-item"><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="delivery-section">
        <div class="delivery-container">
            <h2 class="delivery-header">Delivery & Address Details</h2>

            <div class="order-summary">
                <h4>Order Summary</h4>
                <div id="summary-items"></div>
                <div class="summary-total">
                    <span>Total Amount Payable</span>
                    <span id="summary-total-price" style="color: var(--color-maroon, #701C1C);">₹0</span>
                </div>
            </div>

            <form id="delivery-form" onsubmit="handleDeliverySubmit(event)">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}">
                </div>
                <div class="form-group">
                    <label for="address">Delivery Address *</label>
                    <textarea id="address" rows="3" required placeholder="House/Flat No., Building Name, Street Name"></textarea>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="city">City / Town *</label>
                        <input type="text" id="city" required placeholder="e.g. Ahmedabad">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="pincode">Pincode *</label>
                        <input type="text" id="pincode" required placeholder="e.g. 380001" pattern="[0-9]{6}">
                    </div>
                </div>

                <button type="submit" class="btn-submit">Proceed to Payment <i class="fas fa-credit-card"></i></button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2023 Gharwakhari. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = localStorage.getItem('ghar_user');
            const authNav = document.getElementById('auth-nav-item');
            if (user && authNav) {
                authNav.innerHTML = `<a href="account.html" style="color:var(--color-maroon); font-weight:bold;"><i class="fas fa-user-circle"></i> ${user}</a>`;
                document.getElementById('name').value = user;
            }

            let cart = JSON.parse(localStorage.getItem('ghar_cart')) || [];
            if (cart.length === 0) {
                alert("Your cart is empty. Please add items before checkout.");
                window.location.href = "index.html#shop";
                return;
            }

            const summaryItemsContainer = document.getElementById('summary-items');
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const div = document.createElement('div');
                div.className = 'summary-item';
                div.innerHTML = `
                    <span>${item.name} (x${item.quantity})</span>
                    <span>₹${itemTotal.toLocaleString('en-IN')}</span>
                `;
                summaryItemsContainer.appendChild(div);
            });

            document.getElementById('summary-total-price').textContent = '₹' + total.toLocaleString('en-IN');
        });

        function handleDeliverySubmit(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const city = document.getElementById('city').value;
            const pincode = document.getElementById('pincode').value;

            const fullAddress = `${address}, ${city} - ${pincode}`;

            localStorage.setItem('ghar_pending_delivery', JSON.stringify({
                name,
                phone,
                address: fullAddress
            }));

            window.location.href = "payment.html";
        }
    </script>
</body>

</html>
