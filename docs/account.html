<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharwakhari | My Account & Orders</title>
    <meta name="description" content="View your order history and account details at Gharwakhari.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .account-section {
            padding: 60px 20px;
            min-height: 80vh;
            background-color: #f1f3f6;
        }

        .account-layout {
            max-width: 1150px;
            margin: auto;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .account-sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .user-profile-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            background: var(--color-maroon, #701C1C);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .user-info p {
            margin: 0;
            font-size: 12px;
            color: #777;
        }

        .user-info h3 {
            margin: 0;
            font-size: 16px;
            color: #212121;
        }

        .sidebar-menu {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .menu-section {
            border-bottom: 1px solid #f0f0f0;
        }

        .menu-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #878787;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
        }

        .menu-header i {
            color: var(--color-maroon, #701C1C);
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .menu-items {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-items li a {
            display: block;
            padding: 12px 20px 12px 52px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .menu-items li a:hover,
        .menu-items li a.active {
            color: var(--color-maroon, #701C1C);
            background-color: #fcfbf8;
            font-weight: bold;
        }

        .account-main {
            flex-grow: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 30px;
            min-height: 500px;
        }

        .account-header {
            font-family: 'Playfair Display', serif;
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #212121;
        }

        .order-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-header h4 {
            margin: 0;
            font-size: 14px;
            color: #212121;
        }

        .badge {
            background: #26a541;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-pending {
            background: #f39c12;
        }

        .order-body {
            padding: 20px;
        }

        .delivery-info {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            background: #fafafa;
            padding: 12px;
            border-radius: 6px;
        }

        .order-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .order-item img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-info h5 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #212121;
        }

        .order-item-info p {
            margin: 0;
            font-size: 13px;
            color: #878787;
        }

        .order-item-price {
            font-weight: bold;
            font-size: 15px;
            color: #212121;
        }

        .empty-orders {
            text-align: center;
            color: #878787;
            padding: 60px 20px;
        }

        .btn-shop {
            background-color: var(--color-maroon, #701C1C);
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 25px;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn-shop:hover {
            background-color: var(--color-gold, #C5A059);
            color: #000;
        }

        @media (max-width: 768px) {
            .account-layout {
                flex-direction: column;
            }

            .account-sidebar {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">Gharwakhari</a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label"><span></span></label>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#shop">Shop</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="wishlist.html">Wishlist</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="account-section">
        <div class="account-layout">
            <div class="account-sidebar">
                <div class="user-profile-card">
                    <div class="user-avatar" id="avatar-letter">U</div>
                    <div class="user-info">
                        <p>Hello,</p>
                        <h3 id="profile-name">Guest User</h3>
                    </div>
                </div>

                <div class="sidebar-menu">
                    <div class="menu-section">
                        <div class="menu-header">
                            <i class="fas fa-box"></i> My Orders
                        </div>
                        <ul class="menu-items">
                            <li><a href="#" class="active">Order History</a></li>
                        </ul>
                    </div>

                    <div class="menu-section">
                        <div class="menu-header">
                            <i class="fas fa-heart"></i> My Stuff
                        </div>
                        <ul class="menu-items">
                            <li><a href="wishlist.html">My Wishlist</a></li>
                            <li><a href="cart.html">My Shopping Cart</a></li>
                        </ul>
                    </div>

                    <div class="menu-section" style="padding: 15px 20px;">
                        <a href="#" onclick="logout()" style="color: #d9534f; text-decoration: none; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 12px;">
                            <i class="fas fa-power-off"></i> Logout
                        </a>
                    </div>
                </div>
            </div>

            <div class="account-main">
                <h2 class="account-header">My Orders</h2>
                <div id="orders-container"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2023 Gharwakhari. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = localStorage.getItem('ghar_user') || 'Guest User';
            document.getElementById('profile-name').textContent = user;
            document.getElementById('avatar-letter').textContent = user.charAt(0).toUpperCase();

            renderOrders();
        });

        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('ghar_orders')) || [];
            const container = document.getElementById('orders-container');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-orders">
                        <i class="fas fa-box-open" style="font-size: 3.5rem; color: #ccc; margin-bottom: 15px;"></i>
                        <h4 style="font-size: 18px; color: #333; margin-bottom: 8px;">No Orders Placed Yet</h4>
                        <p style="margin-bottom: 15px; color: #777;">Explore our collection and place your first order!</p>
                        <a href="index.html#shop" class="btn-shop">Start Shopping</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            orders.forEach(order => {
                const isPending = order.status && order.status.includes('Pending');
                const badgeClass = isPending ? 'badge badge-pending' : 'badge';

                const card = document.createElement('div');
                card.className = 'order-card';

                let itemsHtml = '';
                if (order.parsed_cart && order.parsed_cart.length > 0) {
                    order.parsed_cart.forEach(item => {
                        itemsHtml += `
                            <div class="order-item">
                                <img src="${item.image}" alt="${item.name}">
                                <div class="order-item-info">
                                    <h5>${item.name}</h5>
                                    <p>Quantity: ${item.quantity}</p>
                                </div>
                                <div class="order-item-price">₹${(item.price * item.quantity).toLocaleString('en-IN')}</div>
                            </div>
                        `;
                    });
                }

                card.innerHTML = `
                    <div class="order-header">
                        <div>
                            <h4>Order ID: OD${order.id}</h4>
                            <span style="font-size: 12px; color: #777;">Placed on ${order.date || 'Recent'}</span>
                        </div>
                        <div>
                            <span class="${badgeClass}">${order.status || 'Confirmed'}</span>
                        </div>
                    </div>
                    <div class="order-body">
                        <div class="delivery-info">
                            <strong>Deliver to:</strong> ${order.name} (${order.phone})<br>
                            ${order.address}<br>
                            <strong>Payment Method:</strong> ${order.paymentMethod} (Txn: ${order.transaction_id || 'N/A'})
                        </div>
                        ${itemsHtml}
                        <div style="text-align: right; font-weight: bold; font-size: 1.1rem; border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px;">
                            Total Amount: ₹${(order.total || 0).toLocaleString('en-IN')}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function logout() {
            localStorage.removeItem('ghar_user');
            alert("Logged out successfully.");
            window.location.href = "login.html";
        }
    </script>
</body>

</html>
